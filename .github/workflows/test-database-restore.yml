name: Test full database restore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore-test:
    name: Backup production and restore into test database
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SOURCE_DATABASE_URL: ${{ secrets.NEON_DIRECT_DATABASE_URL }}
      TARGET_DATABASE_URL: ${{ secrets.NEON_RESTORE_TEST_DATABASE_URL }}

    steps:
      - name: Check required secrets
        run: |
          if [ -z "$SOURCE_DATABASE_URL" ]; then
            echo "Missing NEON_DIRECT_DATABASE_URL secret."
            exit 1
          fi

          if [ -z "$TARGET_DATABASE_URL" ]; then
            echo "Missing NEON_RESTORE_TEST_DATABASE_URL secret."
            exit 1
          fi

      - name: Create temporary backup directory
        run: mkdir -p backup

      - name: Create a fresh backup from production
        run: |
          docker run --rm \
            -e SOURCE_DATABASE_URL="$SOURCE_DATABASE_URL" \
            -v "$PWD/backup:/backup" \
            postgres:17 \
            pg_dump \
              --format=custom \
              --verbose \
              --no-owner \
              --no-privileges \
              --dbname="$SOURCE_DATABASE_URL" \
              --file=/backup/restore-test.backup

      - name: Verify backup archive
        run: |
          docker run --rm \
            -v "$PWD/backup:/backup" \
            postgres:17 \
            pg_restore \
              --list \
              /backup/restore-test.backup \
              > backup/pg-restore-list.txt

      - name: Restore backup into test database
        run: |
          docker run --rm \
            -e TARGET_DATABASE_URL="$TARGET_DATABASE_URL" \
            -v "$PWD/backup:/backup" \
            postgres:17 \
            pg_restore \
              --verbose \
              --clean \
              --if-exists \
              --no-owner \
              --no-privileges \
              --exit-on-error \
              --dbname="$TARGET_DATABASE_URL" \
              /backup/restore-test.backup

      - name: Verify restored database connection
        run: |
          docker run --rm \
            -e TARGET_DATABASE_URL="$TARGET_DATABASE_URL" \
            postgres:17 \
            psql "$TARGET_DATABASE_URL" \
              --set=ON_ERROR_STOP=1 \
              --command="SELECT current_database(), current_user, NOW();"

      - name: List restored public tables
        run: |
          docker run --rm \
            -e TARGET_DATABASE_URL="$TARGET_DATABASE_URL" \
            postgres:17 \
            psql "$TARGET_DATABASE_URL" \
              --set=ON_ERROR_STOP=1 \
              --tuples-only \
              --command="
                SELECT table_name
                FROM information_schema.tables
                WHERE table_schema = 'public'
                  AND table_type = 'BASE TABLE'
                ORDER BY table_name;
              " | tee backup/restored-tables.txt

      - name: Count restored public tables
        run: |
          TABLE_COUNT=$(docker run --rm \
            -e TARGET_DATABASE_URL="$TARGET_DATABASE_URL" \
            postgres:17 \
            psql "$TARGET_DATABASE_URL" \
              --set=ON_ERROR_STOP=1 \
              --tuples-only \
              --no-align \
              --command="
                SELECT COUNT(*)
                FROM information_schema.tables
                WHERE table_schema = 'public'
                  AND table_type = 'BASE TABLE';
              ")

          TABLE_COUNT=$(echo "$TABLE_COUNT" | tr -d '[:space:]')

          echo "Restored public table count: $TABLE_COUNT"
          echo "RESTORED_TABLE_COUNT=$TABLE_COUNT" >> "$GITHUB_ENV"

          if [ "$TABLE_COUNT" -lt 1 ]; then
            echo "No public tables were restored."
            exit 1
          fi

      - name: Create table row-count report
        run: |
          docker run --rm \
            -e TARGET_DATABASE_URL="$TARGET_DATABASE_URL" \
            postgres:17 \
            bash -c '
              psql "$TARGET_DATABASE_URL" \
                --set=ON_ERROR_STOP=1 \
                --tuples-only \
                --no-align \
                --command="
                  SELECT
                    format(
                      '\''SELECT %L AS table_name, COUNT(*) AS row_count FROM %I.%I;'\'',
                      table_name,
                      table_schema,
                      table_name
                    )
                  FROM information_schema.tables
                  WHERE table_schema = '\''public'\''
                    AND table_type = '\''BASE TABLE'\''
                  ORDER BY table_name;
                " > /tmp/count-statements.sql

              psql "$TARGET_DATABASE_URL" \
                --set=ON_ERROR_STOP=1 \
                --file=/tmp/count-statements.sql
            ' | tee backup/restored-row-counts.txt

      - name: Check Prisma migration table
        run: |
          docker run --rm \
            -e TARGET_DATABASE_URL="$TARGET_DATABASE_URL" \
            postgres:17 \
            psql "$TARGET_DATABASE_URL" \
              --set=ON_ERROR_STOP=1 \
              --command="
                SELECT COUNT(*) AS prisma_migration_count
                FROM public._prisma_migrations;
              " | tee backup/prisma-migrations-check.txt

      - name: Upload restore verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ns-air-klima-restore-test-report
          path: |
            backup/pg-restore-list.txt
            backup/restored-tables.txt
            backup/restored-row-counts.txt
            backup/prisma-migrations-check.txt
          retention-days: 3
          if-no-files-found: warn
